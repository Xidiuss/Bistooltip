name: tests

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 liblua5.1-0-dev
      - name: Full offline gate (syntax + unit suites + plugin e2e)
        run: bash tools/run_all.sh
