name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  discord-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile sender and tests
        run: python -m compileall -q .github/scripts .github/tests
      - name: Run Discord notification tests
        run: python -m unittest discover -s .github/tests -p "test_*.py" -v
