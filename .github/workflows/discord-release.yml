name: Discord Release Notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ping_role:
        description: Ping the BiSTooltip Updates role during this manual test
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out notification code from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Send BiSTooltip release notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BISTOOLTIP_UPDATES_ROLE_ID: "1545592862920671252"
          MANUAL_PING_ROLE: ${{ inputs.ping_role }}
        run: python .github/scripts/discord_release.py
